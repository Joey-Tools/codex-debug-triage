name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python helpers
        run: |
          python3 -m py_compile \
            skills/bug-triage-playbook/scripts/archive_triage.py \
            scripts/run_cisco_cutover_ci_gate.py \
            scripts/validate_cisco_cutover_receipt.py \
            tests/test_archive_triage.py
      - name: Run tests
        run: |
          python3 -m unittest tests.test_archive_triage
      - name: Require admitted Cisco provider cutover
        env:
          CISCO_CUTOVER_RECEIPT_BASE64: ${{ vars.CISCO_CUTOVER_RECEIPT_BASE64 }}
          CISCO_CUTOVER_OBSERVED_CANONICAL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CISCO_CUTOVER_EXPECTED_CANONICAL_COMMIT: ${{ vars.CISCO_CUTOVER_EXPECTED_CANONICAL_COMMIT }}
          CISCO_CUTOVER_EXPECTED_PRIVATE_RELEASE_COMMIT: ${{ vars.CISCO_CUTOVER_EXPECTED_PRIVATE_RELEASE_COMMIT }}
          CISCO_CUTOVER_EXPECTED_RELEASE_MANIFEST_SHA256: ${{ vars.CISCO_CUTOVER_EXPECTED_RELEASE_MANIFEST_SHA256 }}
          CISCO_CUTOVER_EXPECTED_RECEIPT_SHA256: ${{ vars.CISCO_CUTOVER_EXPECTED_RECEIPT_SHA256 }}
        run: python3 scripts/run_cisco_cutover_ci_gate.py
