name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: >-
          python3 -m py_compile
          skills/bug-triage-playbook/scripts/jenkins_artifact_probe.py
          tests/test_jenkins_artifact_probe.py
      - name: Run offline tests
        run: python3 -m unittest tests.test_jenkins_artifact_probe

  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify matrix result
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
